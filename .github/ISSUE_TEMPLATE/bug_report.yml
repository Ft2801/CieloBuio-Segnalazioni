name: Segnalazione di bug
description: Segnala un comportamento errato dell'applicazione
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per la segnalazione. Per le vulnerabilità di sicurezza non usare questo modulo: vedi SECURITY.md.
  - type: textarea
    id: descrizione
    attributes:
      label: Descrizione
      description: Cosa succede e cosa ci si aspetterebbe invece.
    validations:
      required: true
  - type: textarea
    id: passi
    attributes:
      label: Passi per riprodurre
      description: Elenca i passi in ordine, a partire dalla pagina iniziale.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - Installazione Docker Compose
        - Installazione bare-metal (systemd)
        - Build statica GitHub Pages (demo)
        - Altro (specificare nella descrizione)
    validations:
      required: true
  - type: input
    id: versione
    attributes:
      label: Versione
      description: Vedi package.json o la schermata di health (/api/health).
      placeholder: "1.0.0"
  - type: textarea
    id: log
    attributes:
      label: Log o messaggi di errore
      description: Ometti dati personali, password e token.
      render: text
