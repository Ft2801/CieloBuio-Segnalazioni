# CieloBuio Segnalazioni - Integrazione continua
# Esegue controlli di qualità, sicurezza e build su ogni push e pull request.
# Autore: Fabio Tempera (2026)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Permesso minimo per il token: il workflow legge soltanto il codice.
permissions:
  contents: read

# Una sola esecuzione per ramo: nelle pull request la più recente annulla la precedente.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualita:
    name: Qualità, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_DB: cielobuio_integration
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/cielobuio_integration?schema=public"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Verifica delle firme del registry npm
        run: npm audit signatures

      - name: Audit delle dipendenze
        run: npm audit --audit-level=low

      - name: Licenze delle dipendenze di produzione
        run: npm run licenze

      - name: Genera il client Prisma e applica le migrazioni
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Formattazione
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeCheck
        run: npm run typecheck

      - name: Codice e dipendenze inutilizzati
        run: npm run knip

      - name: Flussi con PostgreSQL e storage reali
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/cielobuio_integration?schema=public"

      - name: Test con copertura
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: "https://test.example.com"

      - name: Build statica GitHub Pages
        run: npm run build:pages

      - name: Salva il report di copertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: warn

  e2e:
    name: Test end-to-end e accessibilità (build statica)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      - name: Genera il client Prisma
        run: npx prisma generate

      - name: Build statica GitHub Pages
        run: npm run build:pages

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      - name: Test end-to-end con verifica WCAG 2.2 AA
        run: npm run test:e2e

      - name: Salva il report Playwright
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

  sicurezza:
    name: Sicurezza e infrastruttura
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout con storia completa
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Gitleaks è eseguito dall'immagine Docker con versione fissata. Il
      # safe.directory via variabili d'ambiente evita l'errore di proprietà
      # della directory montata dal runner.
      - name: Scansione dei segreti nella storia del repository
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --verbose --exit-code=1

      # actionlint controlla sintassi ed espressioni dei workflow, incluse le
      # action fissate a SHA. Immagine ufficiale con versione e digest fissati.
      - name: Lint dei workflow GitHub Actions
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -no-color .github/workflows/*.yml

      - name: Lint del Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Lint degli script shell
        run: shellcheck scripts/*.sh

      - name: Validazione del Caddyfile
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/etc/caddy:ro" \
            caddy:2.6.2@sha256:16f4d944907ac8adc93e11df3e4d1b8405d42e4f45e6bc1aae4eb1119552ee79 \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validazione di docker-compose
        run: docker compose -f docker-compose.yml config -q
        env:
          DB_PASSWORD: "password-solo-per-validazione"
          NEXT_PUBLIC_BASE_URL: "https://test.example.com"

  docker:
    name: Immagine Docker e scansione
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build dell'immagine
        run: docker build --build-arg NEXT_PUBLIC_BASE_URL=https://test.example.com -t cielobuio-segnalazioni:ci .

      - name: Scansione delle vulnerabilità (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cielobuio-segnalazioni:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  documentazione:
    name: Documentazione e link
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Controllo dei link nella documentazione
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --exclude 'https://github.com/Ft2801/CieloBuio-Segnalazioni/issues' --exclude 'https://github.com/Ft2801/CieloBuio-Segnalazioni/security/advisories/new' './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  revisione-dipendenze:
    name: Revisione delle dipendenze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confronto delle dipendenze con la base della pull request
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
